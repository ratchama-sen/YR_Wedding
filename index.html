<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yanika & Ratchama Wedding Card</title>
  <style>
    :root {
      --bg1: #f6f3ec;
      --bg2: #e9efe3;
      --text: #5e6940;
      --dot: rgba(95, 105, 64, 0.25);
      --dot-active: #6b7445;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.92), rgba(255,255,255,0) 28%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      color: var(--text);
    }

    .app {
      width: min(100vw, 700px);
      height: 100dvh;
      position: relative;
      overflow: hidden;
      padding-top: max(8px, var(--safe-top));
      padding-bottom: max(14px, var(--safe-bottom));
    }

    .slides {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .slides::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 10px 54px;
      position: relative;
    }

    .card-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255,255,255,0.62);
      box-shadow:
        0 18px 50px rgba(0,0,0,0.12),
        inset 0 0 0 1px rgba(255,255,255,0.66);
      backdrop-filter: blur(10px);
    }

    .card-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      background: transparent;
    }

    .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(10px, calc(var(--safe-bottom) + 4px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .dots {
      display: flex;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .dot.active {
      background: var(--dot-active);
      transform: scale(1.2);
    }

    .hint {
      font-size: 0.82rem;
      line-height: 1;
      color: #6e7657;
      background: rgba(255,255,255,0.5);
      padding: 7px 12px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      opacity: 0.95;
      transition: opacity 0.35s ease;
    }

    .hint.hide {
      opacity: 0;
    }

    @media (min-width: 701px) {
      .slide { padding-left: 24px; padding-right: 24px; padding-bottom: 64px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="slides" id="slides" aria-label="Wedding card flipbook">
      <article class="slide" aria-label="Page 1">
        <div class="card-frame">
          <img src="assets/front.png" alt="Wedding card front" />
        </div>
      </article>
      <article class="slide" aria-label="Page 2">
        <div class="card-frame">
          <img src="assets/back.png" alt="Wedding card back" />
        </div>
      </article>
    </section>

    <div class="overlay" aria-hidden="true">
      <div class="dots">
        <span class="dot active" id="dot1"></span>
        <span class="dot" id="dot2"></span>
      </div>
      <div class="hint" id="hint">Swipe left / right</div>
    </div>
  </main>

  <script>
    const slides = document.getElementById('slides');
    const dots = [document.getElementById('dot1'), document.getElementById('dot2')];
    const hint = document.getElementById('hint');
    let lastIndex = 0;
    let hintHidden = false;

    function updateDots() {
      const index = Math.round(slides.scrollLeft / slides.clientWidth);
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      if (index !== lastIndex) {
        lastIndex = index;
        if (!hintHidden) {
          hint.classList.add('hide');
          hintHidden = true;
        }
      }
    }

    slides.addEventListener('scroll', updateDots, { passive: true });
    slides.addEventListener('touchstart', () => {
      if (!hintHidden) {
        hint.classList.add('hide');
        hintHidden = true;
      }
    }, { passive: true });

    window.addEventListener('resize', updateDots);
    updateDots();
  </script>
</body>
</html>
