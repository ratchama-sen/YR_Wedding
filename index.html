<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f3f1e9" />
  <title>Yanika & Ratchama Wedding Invitation - You’re on our guest list!! </title>

  <style>
    :root {
      --bg1: #f6f3ec;
      --bg2: #e9efe3;
      --dot: rgba(95, 105, 64, 0.24);
      --dot-active: #6b7445;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at top left,
          rgba(255,255,255,0.92),
          rgba(255,255,255,0) 28%
        ),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      overscroll-behavior: none;
    }

    .app {
      position: relative;
      width: min(100vw, 720px);
      height: 100dvh;
      overflow: hidden;
      padding-top: max(4px, var(--safe-top));
      padding-bottom: max(6px, var(--safe-bottom));
    }

    /* =========================
       HORIZONTAL E-BOOK
       ========================= */

    .slides {
      width: 100%;
      height: 100%;
      display: flex;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;

      scrollbar-width: none;
      -ms-overflow-style: none;

      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }

    .slides::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 6px 38px;
    }

    .card-frame {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 18px;

      background: rgba(255,255,255,0.22);

      box-shadow:
        0 18px 45px rgba(0,0,0,0.10);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .card-frame img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      display: block;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }

    /* =========================
       PAGE DOTS
       ========================= */

    .page-indicator {
      position: absolute;
      left: 50%;
      bottom: max(10px, calc(var(--safe-bottom) + 4px));
      transform: translateX(-50%);

      display: flex;
      gap: 7px;
      align-items: center;

      padding: 7px 11px;
      border-radius: 999px;

      background: rgba(255,255,255,0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow: 0 7px 20px rgba(0,0,0,0.06);

      z-index: 20;
      pointer-events: none;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .dot.active {
      background: var(--dot-active);
      transform: scale(1.22);
    }

    /* =========================
       FIRST TAP OVERLAY
       This is intentional:
       iPhone / Safari requires
       a real user gesture before
       audio with sound can play.
       ========================= */

    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(18px, var(--safe-top))
        22px
        max(18px, var(--safe-bottom));

      background:
        linear-gradient(
          145deg,
          rgba(246,243,236,0.94),
          rgba(233,239,227,0.94)
        );

      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);

      cursor: pointer;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-content {
      text-align: center;
      color: #687148;
      user-select: none;
      -webkit-user-select: none;
    }

    .start-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 4.5vw, 1.5rem);
      letter-spacing: 0.03em;
      margin-bottom: 9px;
    }

    .start-subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.72;
    }

    /* =========================
       SOUND STATUS
       No button / no control.
       Only a tiny temporary toast.
       ========================= */

    .sound-status {
      position: fixed;
      left: 50%;
      top: max(12px, calc(var(--safe-top) + 8px));
      transform: translateX(-50%);

      z-index: 9998;

      padding: 7px 11px;
      border-radius: 999px;

      font: 12px/1.2 Arial, Helvetica, sans-serif;
      color: #667044;
      background: rgba(255,255,255,0.62);

      box-shadow: 0 6px 18px rgba(0,0,0,0.06);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    .sound-status.show {
      opacity: 1;
    }

    @media (min-width: 701px) {
      .slide {
        padding: 16px 24px 52px;
      }

      .card-frame {
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <section
      class="slides"
      id="slides"
      aria-label="Wedding Invitation"
    >

      <!-- PAGE 1 : FRONT -->
      <article class="slide" aria-label="Wedding Card Front">
        <div class="card-frame">
          <img
            src="./assets/front.png"
            alt="Yanika and Ratchama Wedding Invitation Front"
          />
        </div>
      </article>

      <!-- PAGE 2 : BACK -->
      <article class="slide" aria-label="Wedding Card Back">
        <div class="card-frame">
          <img
            src="./assets/back.png"
            alt="Yanika and Ratchama Wedding Invitation Back"
          />
        </div>
      </article>

    </section>

    <div class="page-indicator" aria-hidden="true">
      <span class="dot active" id="dot1"></span>
      <span class="dot" id="dot2"></span>
    </div>

  </main>

  <!--
    IMPORTANT:
    Put your audio file here:

    assets/music.m4a

    The browser will play it only after
    the visitor taps the opening screen.
  -->
  <audio
    id="bgMusic"
    src="./assets/music.m4a"
    loop
    preload="auto"
    playsinline
  ></audio>

  <!--
    This opening overlay is the reliable
    mobile solution for iPhone / Safari.
    One tap = open the card + start music.
  -->
  <div
    class="start-overlay"
    id="startOverlay"
    role="button"
    tabindex="0"
    aria-label="Open invitation"
  >
    <div class="start-content">
      <div class="start-title">Tap to open</div>
      <div class="start-subtitle">Yanika &amp; Ratchama said <br>"Are you ready for a big surprise!?"</div>
    </div>
  </div>

  <div class="sound-status" id="soundStatus">
    Music on
  </div>

  <script>
    const slides = document.getElementById("slides");

    const dot1 = document.getElementById("dot1");
    const dot2 = document.getElementById("dot2");

    const bgMusic = document.getElementById("bgMusic");

    const startOverlay =
      document.getElementById("startOverlay");

    const soundStatus =
      document.getElementById("soundStatus");


    /* =========================
       MUSIC SETTINGS
       ========================= */

    // 0.00 = mute
    // 0.30 = soft
    // 0.55 = medium
    // 1.00 = maximum

    bgMusic.volume = 0.55;


    /* =========================
       OPEN CARD + START MUSIC
       ========================= */

    let opened = false;


    function showSoundStatus(text) {

      soundStatus.textContent = text;

      soundStatus.classList.add("show");

      setTimeout(() => {
        soundStatus.classList.remove("show");
      }, 1300);

    }


    function openInvitation() {

      if (opened) {
        return;
      }

      /*
        IMPORTANT:

        bgMusic.play() is called DIRECTLY
        inside the user's click / touch gesture.

        This is the most reliable approach
        for iPhone Safari and Android Chrome.
      */

      const playPromise = bgMusic.play();


      if (playPromise !== undefined) {

        playPromise
          .then(() => {

            opened = true;

            startOverlay.classList.add("hidden");

            showSoundStatus("Music on");

          })
          .catch((error) => {

            console.log(
              "Audio could not start:",
              error
            );

            /*
              Even if the browser cannot
              decode the M4A file, still
              allow the invitation to open.
            */

            opened = true;

            startOverlay.classList.add("hidden");

            showSoundStatus("Open");

          });

      }

      else {

        opened = true;

        startOverlay.classList.add("hidden");

      }

    }


    /*
      Click is preferred because iOS
      treats it as a clear user activation.
    */

    startOverlay.addEventListener(
      "click",
      openInvitation
    );


    /*
      Keyboard fallback for desktop.
    */

    startOverlay.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          openInvitation();

        }

      }
    );


    /* =========================
       PAGE INDICATOR
       ========================= */

    function updatePageIndicator() {

      const pageWidth =
        slides.clientWidth;

      const currentPage =
        Math.round(
          slides.scrollLeft /
          pageWidth
        );


      if (currentPage === 0) {

        dot1.classList.add("active");
        dot2.classList.remove("active");

      }

      else {

        dot1.classList.remove("active");
        dot2.classList.add("active");

      }

    }


    slides.addEventListener(
      "scroll",
      updatePageIndicator,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      updatePageIndicator
    );


    updatePageIndicator();


    /* =========================
       AUDIO DEBUG
       ========================= */

    bgMusic.addEventListener(
      "error",
      function() {

        console.log(
          "Audio file error. Check that ./assets/music.m4a exists and uses a browser-compatible codec."
        );

      }
    );

  </script>

</body>
</html>
